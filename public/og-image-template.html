<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craftisle Draw OG Image Template</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }
    
    .og-image {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    
    /* 装饰元素 */
    .decoration {
      position: absolute;
      opacity: 0.1;
    }
    
    .decoration-1 {
      top: 50px;
      left: 100px;
      width: 300px;
      height: 200px;
      border: 3px solid white;
      border-radius: 10px;
      transform: rotate(-5deg);
    }
    
    .decoration-2 {
      bottom: 80px;
      right: 150px;
      width: 250px;
      height: 180px;
      border: 3px solid white;
      border-radius: 10px;
      transform: rotate(3deg);
    }
    
    .decoration-3 {
      top: 150px;
      right: 250px;
      width: 150px;
      height: 150px;
      border: 2px solid white;
      border-radius: 50%;
    }
    
    /* 主内容 */
    .content {
      text-align: center;
      z-index: 10;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      background: white;
      border-radius: 20px;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      color: #667eea;
      font-weight: bold;
    }
    
    h1 {
      font-size: 72px;
      color: white;
      font-weight: 800;
      margin-bottom: 20px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }
    
    .subtitle {
      font-size: 32px;
      color: white;
      opacity: 0.95;
      margin-bottom: 40px;
      font-weight: 400;
    }
    
    .features {
      display: flex;
      gap: 40px;
      margin-top: 20px;
    }
    
    .feature {
      color: white;
      font-size: 24px;
      opacity: 0.9;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .feature-icon {
      width: 30px;
      height: 30px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    
    .url {
      position: absolute;
      bottom: 40px;
      font-size: 28px;
      color: white;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="og-image">
    <!-- 装饰元素 -->
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>
    <div class="decoration decoration-3"></div>
    
    <!-- 主内容 -->
    <div class="content">
      <div class="logo">C</div>
      <h1>Craftisle Draw</h1>
      <p class="subtitle">Free Online Whiteboard & Collaborative Drawing Tool</p>
      
      <div class="features">
        <div class="feature">
          <span class="feature-icon">✓</span>
          <span>Infinite Canvas</span>
        </div>
        <div class="feature">
          <span class="feature-icon">✓</span>
          <span>Real-time Collab</span>
        </div>
        <div class="feature">
          <span class="feature-icon">✓</span>
          <span>Export PNG/SVG</span>
        </div>
      </div>
    </div>
    
    <div class="url">draw.craftisle.com</div>
  </div>
  
  <div style="padding: 40px; text-align: center;">
    <h2>OG Image Template</h2>
    <p>Screenshot this page at 1200x630px and save as <code>og-image.png</code></p>
    <button onclick="downloadAsImage()" style="padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px;">
      Download as PNG
    </button>
  </div>
  
  <script>
    function downloadAsImage() {
      alert('Please take a screenshot of the OG image above (1200x630px) and save it as og-image.png');
    }
  </script>
</body>
</html>
